name: glider
description: An opinionated Hacker News client.
publish_to: "none"
version: 1.18.1+41

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  async: ^2.9.0
  cached_network_image: ^3.2.2
  collection: ^1.16.0
  device_info_plus: ^13.2.0
  diffutil_dart: ^5.0.0
  dio: ^5.11.0
  dio_smart_retry: ^7.0.1
  equatable: ^2.0.5
  fluentui_system_icons: ^1.1.184
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.3.0
  flutter_displaymode: ^0.7.0
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  flutter_web_browser: ^0.17.1
  flutter_widget_from_html_core: ^0.17.2
  form_builder_validators: ^11.3.0
  freezed_annotation: ^3.1.0
  hooks_riverpod: ^3.3.2
  html: ^0.15.0
  riverpod: ^3.3.2
  html_unescape: ^2.0.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  native_launcher:
    path: packages/native_launcher
  octo_image: ^2.1.0
  package_info_plus: ^10.2.1
  queue: ^3.1.0+1
  relative_time: ^5.0.0
  share_plus: ^13.3.0
  shared_preferences: ^2.0.15
  shimmer: ^3.0.0
  app_links: ^6.4.0
  url_launcher: ^6.1.6

dev_dependencies:
  build_runner: ^2.3.2
  flutter_launcher_icons: ^0.14.4
  freezed: ^3.2.5
  json_serializable: ^6.5.3

flutter:
  uses-material-design: true
  generate: true

flutter_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
    icon_size: 256
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#e57373"
  adaptive_icon_foreground: "assets/icon/adaptive_icon.png"
  min_sdk_android: 18
